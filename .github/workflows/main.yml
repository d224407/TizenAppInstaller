name: Build Android APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission
      run: chmod +x gradlew

    - name: Build APK
      id: build
      continue-on-error: true
      run: |
        ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

    - name: Upload error logs if build failed
      if: steps.build.outcome == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: build-error-logs
        path: |
          build.log
          **/build/reports/
          **/build/outputs/logs/

    - name: Upload APK if build succeeded
      if: steps.build.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk

    - name: Fail workflow if build failed
      if: steps.build.outcome == 'failure'
      run: exit 1
