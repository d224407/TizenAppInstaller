name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@main

      - name: Set up JDK 17
        uses: actions/setup-java@main
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@main

      - name: Build Debug APK
        id: build-debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug 2>&1 | tee debug-build.log

      - name: Build Release APK
        id: build-release
        run: |
          ./gradlew assembleRelease 2>&1 | tee release-build.log

      - name: Upload Debug logs (always)
        if: always()
        uses: actions/upload-artifact@main
        with:
          name: debug-build-logs
          path: debug-build.log

      - name: Upload Release logs (always)
        if: always()
        uses: actions/upload-artifact@main
        with:
          name: release-build-logs
          path: release-build.log

      - name: Upload Debug APK (if exists)
        if: success() || steps.build-debug.outcome == 'success'
        uses: actions/upload-artifact@main
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK (if exists)
        if: success() || steps.build-release.outcome == 'success'
        uses: actions/upload-artifact@main
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
