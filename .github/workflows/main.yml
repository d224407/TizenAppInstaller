name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission
      run: chmod +x gradlew

    - name: Clean
      run: ./gradlew clean

    - name: Build APK with FULL logs
      id: build
      continue-on-error: true
      run: |
        # Ghi log vào file và console
        ./gradlew assembleDebug --stacktrace --info --full-stacktrace 2>&1 | tee build-full.log
        
        # Lưu exit code
        echo "GRADLE_EXIT=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

    - name: ALWAYS upload logs (even on failure)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build-full.log
          **/build/reports/
          **/build/outputs/logs/
          **/build/test-results/
          **/.gradle/
          **/*.log
          app/build.gradle
          build.gradle
          settings.gradle
          gradle/wrapper/gradle-wrapper.properties

    - name: Upload APK if exists
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: apk-files
        path: |
          **/build/outputs/apk/**/*.apk
          **/*.apk

    - name: Show build result
      run: |
        echo "Gradle exit code: ${{ steps.build.outputs.GRADLE_EXIT }}"
        echo "Build outcome: ${{ steps.build.outcome }}"
        
        # Hiện 50 dòng cuối của log
        echo "=== Last 50 lines of log ==="
        tail -50 build-full.log || echo "Không có log"

    - name: Fail workflow if build failed
      if: steps.build.outcome == 'failure'
      run: exit 1
