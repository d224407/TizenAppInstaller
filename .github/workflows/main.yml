name: Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission
      run: chmod +x gradlew

    - name: Clean
      run: ./gradlew clean

    - name: Build APK
      run: |
        ./gradlew assembleDebug --stacktrace
        
    - name: List all APK files
      run: |
        echo "=== Tìm tất cả APK ==="
        find . -name "*.apk" -type f
        echo "=== Kiểm tra thư mục outputs ==="
        ls -la app/build/outputs/ || echo "Không có outputs"
        echo "=== Kiểm tra thư mục apk ==="
        ls -la app/build/outputs/apk/ || echo "Không có apk"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: |
          **/build/outputs/apk/**/*.apk
          **/*.apk
